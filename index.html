<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日待办 - DailyTodo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0D9488;
      --primary-light: #14B8A6;
      --secondary: #99F6E4;
      --cta: #F97316;
      --cta-hover: #EA580C;
      --bg: #F0FDFA;
      --bg-card: #FFFFFF;
      --text: #134E4A;
      --text-muted: #5F8A87;
      --border: #CCFBF1;
      --success: #22C55E;
      --danger: #EF4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 100px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      margin-bottom: 24px;
    }

    .greeting {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .date {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    /* Progress Card */
    .progress-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .progress-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }

    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Task Input */
    .task-input-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .task-input {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.2s ease;
      outline: none;
    }

    .task-input:focus {
      border-color: var(--primary);
    }

    .task-input::placeholder {
      color: var(--text-muted);
    }

    .add-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--cta);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .add-btn:hover {
      background: var(--cta-hover);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    .add-btn svg {
      width: 24px;
      height: 24px;
      color: white;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-tab:not(.active):hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .task-item:hover {
      border-color: var(--primary-light);
      box-shadow: 0 2px 8px rgba(13, 148, 136, 0.08);
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      margin-top: 1px;
    }

    .task-item.completed .task-checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .task-checkbox svg {
      width: 12px;
      height: 12px;
      color: white;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .task-item.completed .task-checkbox svg {
      opacity: 1;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .task-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--secondary);
      color: var(--text);
    }

    .task-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .task-delete {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .task-delete:hover {
      background: #FEE2E2;
      color: var(--danger);
    }

    .task-delete svg {
      width: 16px;
      height: 16px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      color: var(--border);
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    .empty-text {
      font-size: 14px;
    }

    /* Animations */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item {
      animation: slideIn 0.2s ease;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .task-item {
        animation: none;
      }
      .progress-fill {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <p class="greeting">下午好 👋</p>
      <h1 class="date" id="currentDate"></h1>
    </div>

    <!-- Progress -->
    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-title">今日进度</span>
        <span class="progress-count" id="progressCount">0 / 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Task Input -->
    <div class="task-input-card">
      <div class="input-row">
        <input 
          type="text" 
          class="task-input" 
          id="taskInput" 
          placeholder="添加新任务..."
          autocomplete="off"
        >
        <button class="add-btn" id="addBtn" aria-label="添加任务">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="todo">待完成</button>
      <button class="filter-tab" data-filter="done">已完成</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskList">
      <!-- Tasks will be rendered here -->
    </div>
  </div>

  <script>
    // State
    let tasks = JSON.parse(localStorage.getItem('dailyTodos') || '[]');
    let currentFilter = 'all';

    // Elements
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const filterTabs = document.getElementById('filterTabs');
    const progressFill = document.getElementById('progressFill');
    const progressCount = document.getElementById('progressCount');
    const currentDateEl = document.getElementById('currentDate');

    // Initialize date
    function initDate() {
      const now = new Date();
      const options = { month: 'long', day: 'numeric', weekday: 'long' };
      currentDateEl.textContent = now.toLocaleDateString('zh-CN', options);
    }

    // Render tasks
    function renderTasks() {
      const filtered = tasks.filter(task => {
        if (currentFilter === 'todo') return !task.completed;
        if (currentFilter === 'done') return task.completed;
        return true;
      });

      if (filtered.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <p class="empty-title">${currentFilter === 'done' ? '还没有已完成的任务' : '今日任务已全部完成 🎉'}</p>
            <p class="empty-text">${currentFilter === 'done' ? '完成一些任务吧' : '添加新任务开始吧'}</p>
          </div>
        `;
        return;
      }

      taskList.innerHTML = filtered.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
          <div class="task-checkbox">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <div class="task-content">
            <p class="task-text">${escapeHtml(task.text)}</p>
            <div class="task-meta">
              <span class="task-tag">${getCategoryLabel(task.category)}</span>
              <span class="task-time">${task.time || ''}</span>
            </div>
          </div>
          <button class="task-delete" aria-label="删除任务" onclick="deleteTask(${task.id})">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>
      `).join('');

      // Add click handlers
      document.querySelectorAll('.task-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.closest('.task-delete')) return;
          toggleTask(parseInt(item.dataset.id));
        });
      });
    }

    // Update progress
    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      
      progressFill.style.width = `${percent}%`;
      progressCount.textContent = `${completed} / ${total}`;
    }

    // Add task
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      const categories = ['工作', '学习', '生活', '健康'];
      const task = {
        id: Date.now(),
        text,
        completed: false,
        category: categories[Math.floor(Math.random() * categories.length)],
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      };

      tasks.unshift(task);
      saveTasks();
      taskInput.value = '';
      renderTasks();
      updateProgress();
    }

    // Toggle task
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
        updateProgress();
      }
    }

    // Delete task
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
      updateProgress();
    }

    // Save to localStorage
    function saveTasks() {
      localStorage.setItem('dailyTodos', JSON.stringify(tasks));
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Get category label
    function getCategoryLabel(category) {
      const labels = {
        '工作': '💼 工作',
        '学习': '📚 学习',
        '生活': '🏠 生活',
        '健康': '💪 健康'
      };
      return labels[category] || category;
    }

    // Event listeners
    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    filterTabs.addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-tab')) {
        document.querySelector('.filter-tab.active').classList.remove('active');
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderTasks();
      }
    });

    // Initialize
    initDate();
    
    // Add some sample tasks if empty
    if (tasks.length === 0) {
      tasks = [
        { id: 1, text: '阅读产品设计文档', completed: false, category: '工作', time: '09:00' },
        { id: 2, text: '完成用户调研报告', completed: true, category: '工作', time: '10:30' },
        { id: 3, text: '30分钟晨间瑜伽', completed: false, category: '健康', time: '07:00' },
        { id: 4, text: '复习英语单词', completed: false, category: '学习', time: '08:00' },
      ];
      saveTasks();
    }
    
    renderTasks();
    updateProgress();
  </script>
</body>
</html>
