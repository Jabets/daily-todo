<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日待办 - DailyTodo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <p class="greeting">下午好 👋</p>
        <h1 class="date" id="currentDate"></h1>
      </div>
      <button class="logout-btn" id="logoutBtn">退出</button>
    </div>

    <!-- Progress -->
    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-title">今日进度</span>
        <span class="progress-count" id="progressCount">0 / 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Task Input -->
    <div class="task-input-card">
      <div class="input-row">
        <input
          type="text"
          class="task-input"
          id="taskInput"
          placeholder="添加新任务..."
          autocomplete="off"
        >
        <button class="add-btn" id="addBtn" aria-label="添加任务">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="todo">待完成</button>
      <button class="filter-tab" data-filter="done">已完成</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskList">
      <!-- Tasks will be rendered here -->
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
